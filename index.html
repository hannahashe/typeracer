<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google Fonts -->
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400..900;1,400..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap");
    </style>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- Font Awesome kit -->
    <script
      src="https://kit.fontawesome.com/7bf12df681.js"
      crossorigin="anonymous"
    ></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/styles.css" />
    <title>TypeRacer</title>
  </head>
  <body class="bg-light text-body">
    <header class="bg-primary text-white py-4 mb-0 shadow-sm">
      <div
        class="container d-flex flex-column flex-md-row align-items-md-center justify-content-md-between gap-2"
      >
        <div>
          <h1 class="h3 mb-1">Type Speed Test</h1>
          <p class="lead mb-0">
            Practice typing speed with a clean, responsive layout.
          </p>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-light btn-cta btn-sm text-primary fw-semibold">
            How it works
          </button>
          <button class="btn btn-outline-light btn-sm">Log in</button>
        </div>
      </div>
    </header>

    <main class="container py-4">
      <div class="row g-4">
        <div class="col-lg-8">
          <div class="card shadow-sm mb-3">
            <div
              class="card-body d-flex flex-column flex-lg-row align-items-lg-center gap-3"
            >
              <div class="d-flex flex-column flex-md-row gap-2 align-items-md-center">
                <span class="text-uppercase text-muted fw-semibold small">Mode</span>
                <div class="btn-group" role="group" aria-label="Difficulty modes">
                  <button type="button" class="btn btn-outline-secondary active">
                    Easy
                  </button>
                  <button type="button" class="btn btn-outline-secondary">
                    Medium
                  </button>
                  <button type="button" class="btn btn-outline-secondary">
                    Hard
                  </button>
                </div>
              </div>

              <div class="d-flex flex-wrap gap-2 ms-lg-auto">
                <button type="button" class="btn btn-primary">
                  Start
                </button>
                <button type="button" class="btn btn-outline-danger">
                  Stop
                </button>
                <button type="button" class="btn btn-outline-secondary">
                  Retry
                </button>
              </div>
            </div>
          </div>

          <div class="card shadow-sm h-100">
            <div class="card-body">
              <div
                class="d-flex align-items-center justify-content-between mb-3"
              >
                <h2 class="h5 mb-0">Test Area</h2>
              </div>
              <p class="text-muted small mb-3">
                Press start to load a prompt and begin typing. Your timer will
                begin with the first keystroke.
              </p>
              <div class="p-3 border rounded bg-white-50 placeholder-area">
                Test content will go here.
              </div>
            </div>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="card shadow-sm h-100">
            <div class="card-body">
              <h2 class="h5 mb-3">Results</h2>
              <div class="d-flex flex-column gap-2 results-list">
                <div class="d-flex justify-content-between align-items-center">
                  <span class="text-muted">Words per minute</span>
                  <span class="fw-semibold">—</span>
                </div>
                <div class="d-flex justify-content-between align-items-center">
                  <span class="text-muted">Accuracy</span>
                  <span class="fw-semibold">—</span>
                </div>
                <div class="d-flex justify-content-between align-items-center">
                  <span class="text-muted">Time</span>
                  <span class="fw-semibold">—</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
